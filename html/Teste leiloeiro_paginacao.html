<!DOCTYPE html>
<html lang="pt">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
			crossorigin="anonymous"
		/>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
			integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
			crossorigin="anonymous"
			referrerpolicy="no-referrer"
		/>

		<style>
			/* Estilo básico */
			body {
				padding: 0;
			}
			body.no-scroll {
				overflow: hidden;
			}

			#loader {
				display: none;
				border: 8px solid #f3f3f3;
				border-top: 8px solid #3498db;
				border-radius: 50%;
				width: 40px;
				height: 40px;
				animation: spin 1s linear infinite;
				margin: 20px auto;
			}
			@keyframes spin {
				0% {
					transform: rotate(0deg);
				}
				100% {
					transform: rotate(360deg);
				}
			}

			.buttons-leiloeiros {
				display: flex;
				justify-content: flex-end;
				align-items: center;
			}

			.buttons-leiloeiros button {
				margin-right: 8px;
			}

			table {
				margin-top: 60px;
			}

			.sortable {
				cursor: pointer;
			}

			.sort-icon {
				margin-left: 5px;
				display: inline-block;
			}

			.asc::after {
				content: "▲"; /* Ícone para ordem ascendente */
			}

			.desc::after {
				content: "▼"; /* Ícone para ordem descendente */
			}

			input {
				color: #404040 !important;
			}

			/* Responsividade */
			@media screen and (max-width: 600px) {
				table {
					font-size: 14px;
					min-width: 1000px;
				}

				.table-responsive {
					overflow-x: hidden;
				}

				th,
				td {
					padding: 8px;
				}

				.has-global-padding {
					padding-left: 0 !important;
					padding-right: 0 !important;
				}
			}
		</style>
	</head>
	<body>
		<div class="container" style="margin-top: 80px">
			<div class="row">
				<div class="col-sm-12 col-md-12 col-lg-9 mt-2">
					<input
						type="text"
						id="palavra_chave"
						placeholder="Digite o leiloeiro desejado."
						min="3"
						max="60"
					/>
				</div>
				<div class="col-sm-12 col-md-12 col-lg-3 mt-2 buttons-leiloeiros">
					<button
						type="button"
						id="buscar"
						onclick="searchWordKey(this)"
						disabled
					>
						Buscar
					</button>
					<button type="button" id="clear" class="btn btn-outline-secondary">
						Limpar
					</button>
				</div>
			</div>

			<div class="row">
				<div id="loader"></div>
				<div
					id="alert"
					class="alert alert-warning"
					role="alert"
					style="display: none"
				></div>
			</div>

			<!-- <div id="resultados" class="table-responsive mt-3"></div> -->

			<!-- Paginação -->
			<nav aria-label="Page navigation" class="mt-3">
				<ul class="pagination justify-content-center">
					<span id="pageNumbers" class="d-flex"></span>
				</ul>
			</nav>

			<!-- Modal -->
			<div
				class="modal fade"
				id="modalLeiloeiro"
				tabindex="-1"
				aria-labelledby="modalLeiloeiroLabel"
				aria-hidden="true"
			>
				<div class="modal-dialog modal-dialog-centered">
					<div class="modal-content">
						<div class="modal-header">
							<h1 class="modal-title fs-5" id="modalLeiloeiro">Leiloeiro</h1>
							<button
								type="button"
								class="btn-close"
								data-bs-dismiss="modal"
								aria-label="Close"
							></button>
						</div>
						<div class="modal-body">
							<div class="row nome mt-1">
								<h5>Nome</h5>
								<text></text>
							</div>
							<div class="row email mt-1">
								<h5>Email</h5>
								<text></text>
							</div>
							<div class="row site mt-1">
								<h5>Site</h5>
								<text></text>
							</div>
							<div class="row confiavel mt-1">
								<h5>Confiável</h5>
								<text></text>
							</div>
							<div class="row status mt-1">
								<h5>Status site</h5>
								<text></text>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
			crossorigin="anonymous"
		></script>
		<script>
			let table = null;
			let tbody = null;
			let resultFiltrados = [];
			let resultNotFiltrados = [];
			let filtred = false;
			let currentPage = 1;
			let rowsPerPage = 100;
			let totalPages = 0;
			let maxPagesToShow = 5;
			let isMobile = window.matchMedia("(max-width: 768px)").matches;

			const wordKeyEl = document.getElementById("palavra_chave");
			const content = document.querySelector("#resultados");
			const pagination = document.querySelector(".pagination");
			const button = document.getElementById("buscar");
			const clearButton = document.getElementById("clear");
			const loader = document.getElementById("loader");

			var URL = "https://api.arremataisolucoes.com.br:5001";

			window.addEventListener("resize", () => {
				if (window.innerWidth <= 768) {
					isMobile = true;
					createdTableMobile();
					renderRowsMobile(1);
				} else {
					isMobile = false;
					createdTable();
					renderRows(1);
				}
			});

			function loadingSearch(loading) {
				if (loading) {
					loader.style.display = "block";
					button.setAttribute("disabled", true);
					clearButton.setAttribute("disabled", true);
				} else {
					loader.style.display = "none";
					button.removeAttribute("disabled");
					clearButton.removeAttribute("disabled");
				}
			}

			// CLEAR BUTTON ACTION
			document.addEventListener("DOMContentLoaded", () => {
				clearButton.addEventListener("click", () => {
					loadingSearch(true);
					filtred = false;

					if (isMobile) {
						createdTableMobile();
						renderRowsMobile(1);
					} else {
						createdTable();
						renderRows(1);
					}
					wordKeyEl.value = undefined;
					loadingSearch(false);
				});
			});

			document.addEventListener("DOMContentLoaded", () => {
				const queryParam = getQuery("query"); // Captura a query da URL
				const input = document.getElementById("palavra_chave");
				const button = document.getElementById("buscar");

				// Se não encontrar a query na URL, busca todos os leiloeiros
				if (!queryParam) {
					loadingSearch(true);

					if (isMobile) {
						createdTableMobile();
					} else {
						createdTable();
					}

					// Carregado dados iniciais
					getLeiloeiros()
						.then((leiloeiros) => {
							resultNotFiltrados = leiloeiros;

							if (isMobile) {
								renderRowsMobile(1);
							} else {
								renderRows(1);
							}
						})
						.finally(() => loadingSearch(false));
				} else {
					// Se encontrar a query na URL, preenche o campo de input e faz a pesquisa
					input.value = queryParam;
					loadingSearch(true);
					searchWordKey(button).finally(() => loadingSearch(false));
				}

				// Evento para habilitar o botão de busca quando o usuário digitar algo no campo
			});

			async function getLeiloeiros() {
				const response = await fetch(URL + "/leiloeiros");
				const result = await response.json();

				if (result && result.data.success) {
					return result.data.dados;
				}

				return [];
			}

			async function searchWordKey(el) {
				if (wordKeyEl.value) {
					const response = await fetch(
						URL + "/leiloeiros/palavra/" + wordKeyEl.value
					);
					const result = await response.json();

					if (result && result.data.success) {
						const [tipo, dados] = result.data.dados;

						if (dados.length > 0) {
							resultFiltrados = dados;
							filtred = true;
							if (isMobile) {
								createdTableMobile();
								renderRowsMobile(1);
							} else {
								createdTable();
								renderRows(1);
							}
						}

						return dados;
					}
				} else {
					filtred = false;
					if (isMobile) {
						createdTableMobile();
						renderRowsMobile(1);
					} else {
						createdTable();
						renderRows(1);
					}
				}
			}

			function getQuery(param) {
				const urlParams = new URLSearchParams(window.location.search);
				return urlParams.get(param);
			}

			function renderRows(page) {
				tbody.innerHTML = "";
				let data = filtred ? resultFiltrados : resultNotFiltrados;
				if (!data || data.length === 0) {
					return;
				}
				let inicio = (page - 1) * rowsPerPage;
				let fim = inicio + rowsPerPage;
				let paginatedItems = data.slice(inicio, fim);

				paginatedItems.forEach((leiloeiro) => {
					let row = ` 
                    <tr>
						<td><a target="_blank" href="https://${leiloeiro.site
							.trim()
							.toLowerCase()}">${leiloeiro.site.trim().toLowerCase()}</a></td>
                        <th scope="row">${leiloeiro.nome.trim()}</th>
                        <td>${leiloeiro.email.trim()}</td>
                        <td>${leiloeiro.estado}</td>
                        <td>${
													leiloeiro.confiavel
														? '<span class="badge bg-primary">Confiável</span>'
														: '<span class="badge bg-warning">Perigoso</span>'
												}</td>
                        <td>${
													leiloeiro.status_site
														? '<span class="badge bg-success">Online</span>'
														: '<span class="badge bg-danger">Offline</span>'
												}</td>
                    </tr>`;
					tbody.innerHTML += row;
				});

				totalPages = Math.ceil(data.length / rowsPerPage);

				table.appendChild(tbody);
				updatePagination(data.length, page);
			}

			function renderRowsMobile(page) {
				tbody.innerHTML = "";
				let data = filtred ? resultFiltrados : resultNotFiltrados;
				if (!data || data.length === 0) {
					return;
				}
				let inicio = (page - 1) * rowsPerPage;
				let fim = inicio + rowsPerPage;
				let paginatedItems = data.slice(inicio, fim);

				paginatedItems.forEach((leiloeiro) => {
					let row = `
                    <tr data-bs-toggle="modal" data-bs-target="#modalLeiloeiro" onClick='renderModal(${
											leiloeiro.id
										})'>
						<th scope="row" data-bs-toggle="modal" data-bs-target="#modalLeiloeiro" onClick='renderModal(${
							leiloeiro.id
						})' style="text-align: center;"><i class="fa-solid fa-eye" style="color: #85c226;"></i></th>
						<td>${
							leiloeiro.status_site
								? '<span class="badge bg-success">Online</span>'
								: '<span class="badge bg-danger">Offline</span>'
						}</td>
                        <td data-bs-toggle="modal" data-bs-target="#modalLeiloeiro" onClick='renderModal(${
													leiloeiro.id
												})'>${renderSiteOrNomeOrEmail(leiloeiro)}</td>
						
                    </tr>`;
					tbody.innerHTML += row;
				});

				totalPages = Math.ceil(data.length / rowsPerPage);

				table.appendChild(tbody);
				updatePagination(data.length, page);
			}

			function renderSiteOrNomeOrEmail(leiloeiro) {
				if (leiloeiro.site) {
					return `<a target="_blank" href="https://${leiloeiro.site
						.trim()
						.toLowerCase()}">${leiloeiro.site.trim().toLowerCase()}</a>`;
				} else if (leiloeiro.nome) {
					return leiloeiro.nome.trim();
				} else {
					return leiloeiro.email.trim();
				}
			}

			function renderModal(leiloeiroId) {
				let data = filtred ? resultFiltrados : resultNotFiltrados;

				const leiloeiro = data.find((e) => e.id === leiloeiroId);

				if (leiloeiro) {
					console.log(leiloeiro);
					const modal = document.querySelector("#modalLeiloeiro");
					const nome = modal.querySelector(".nome text");
					const email = modal.querySelector(".email text");
					const site = modal.querySelector(".site text");
					const confiavel = modal.querySelector(".confiavel text");
					const status = modal.querySelector(".status text");

					nome.innerText =
						!leiloeiro.nome || leiloeiro.nome === "" ? " - " : leiloeiro.nome;
					email.innerText =
						!leiloeiro.email || leiloeiro.email === ""
							? " - "
							: leiloeiro.email;
					site.innerHTML =
						!leiloeiro.email || leiloeiro.email === ""
							? "-"
							: `<a target="_blank" href="https://${leiloeiro.site
									.trim()
									.toLowerCase()}">${leiloeiro.site.trim().toLowerCase()}</a>`;
					confiavel.innerHTML = leiloeiro.confiavel
						? '<span class="badge bg-primary">Confiável</span>'
						: '<span class="badge bg-warning">Perigoso</span>';
					status.innerHTML = leiloeiro.status_site
						? '<span class="badge bg-success">Online</span>'
						: '<span class="badge bg-danger">Offline</span>';
				}
			}

			function updatePagination(totalItems, currentPage) {
				let paginationNumbers = document.getElementById("pageNumbers");
				paginationNumbers.innerHTML = "";

				let startPage = Math.max(
					1,
					currentPage - Math.floor(maxPagesToShow / 2)
				);
				let endPage = Math.min(totalPages, startPage + maxPagesToShow - 1);
				if (endPage - startPage + 1 < maxPagesToShow) {
					startPage = Math.max(1, endPage - maxPagesToShow + 1);
				}

				for (let i = startPage; i <= endPage; i++) {
					let pageItem = document.createElement("li");
					pageItem.classList.add("page-item");
					if (i === currentPage) pageItem.classList.add("active");

					let pageLink = document.createElement("a");
					pageLink.classList.add("page-link");
					pageLink.href = "#";
					pageLink.innerText = i;
					pageLink.onclick = function () {
						isMobile ? renderRowsMobile(i) : renderRows(i);
					};

					pageItem.appendChild(pageLink);
					paginationNumbers.appendChild(pageItem);
				}
			}

			function createdTable() {
				// Remove todas as tabelas se tiver
				document
					.querySelectorAll("#resultados > .table-responsive")
					.forEach((el) => el.remove());

				let tableWrapper = document.createElement("div");
				tableWrapper.classList.add("table-responsive");

				table = document.createElement("table");
				table.setAttribute("id", "sortableTable");
				table.setAttribute("data-order", "asc");
				table.classList.add("table", "table-striped", "table-hover");
				const thead = document.createElement("thead");
				tbody = document.createElement("tbody");
				thead.innerHTML = `
                    <tr>
												<th onclick="sortTable(this, 0)" scope="col" class="sortable">Site</th>
                        <th onclick="sortTable(this, 1)" scope="col" class="sortable">Nome</th>
                        <th onclick="sortTable(this, 2)" scope="col" class="sortable">Email</th>
                        <th onclick="sortTable(this, 3)" scope="col" class="col-1 sortable">Estado</th>
                        <th scope="col" class="col-1">Confiável</th>
                        <th scope="col" class="col-1">Status</th>
                    </tr>
                `;
				table.appendChild(thead);
				tableWrapper.appendChild(table);
				content.appendChild(tableWrapper);
			}

			function createdTableMobile() {
				// Remove todas as tabelas se tiver
				document
					.querySelectorAll("#resultados > .table-responsive")
					.forEach((el) => el.remove());

				let tableWrapper = document.createElement("div");
				tableWrapper.classList.add("table-responsive");

				table = document.createElement("table");
				table.setAttribute("id", "sortableTable");
				table.setAttribute("data-order", "asc");
				table.classList.add("table", "table-striped", "table-hover");
				const thead = document.createElement("thead");
				tbody = document.createElement("tbody");
				thead.innerHTML = `
                    <tr>
 						<th class="col-1">Detalhes</th>
						<th class="sortable col-1">Status</th>
						<th onclick="sortTable(this, 0)" class="sortable col-9">Site/Nome/Email</th>
                    </tr>
                `;
				table.appendChild(thead);
				tableWrapper.appendChild(table);
				content.appendChild(tableWrapper);
			}

			function sortTable(el, columnIndex) {
				const table = document.getElementById("sortableTable");
				const headers = table.querySelectorAll("thead th.sortable");

				const isAsc = el.classList.contains("asc");

				console.log("isAsc", isAsc);

				headers.forEach((h) => h.classList.remove("asc", "desc"));

				const rows = Array.from(table.rows).slice(1);

				console.log("rows", rows.length);

				rows.sort((a, b) => {
					const cellA = a.cells[columnIndex].textContent.trim().toLowerCase();
					const cellB = b.cells[columnIndex].textContent.trim().toLowerCase();

					if (!isAsc) {
						return isNaN(cellA) || isNaN(cellB)
							? cellA.localeCompare(cellB)
							: cellA - cellB;
					} else if (isAsc) {
						return isNaN(cellA) || isNaN(cellB)
							? cellB.localeCompare(cellA)
							: cellB - cellA;
					}
				});

				rows.forEach((row) => table.tBodies[0].appendChild(row));

				el.classList.toggle("asc", !isAsc);
				el.classList.toggle("desc", isAsc);
			}
		</script>
	</body>
</html>

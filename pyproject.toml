[tool.poetry]
name = "arrematai"
version = "1.0.53"
description = ""
authors = ["rafaelnr <rafaelnetto_@hotmail.com>"]
packages = [
    { include = "src" },
    { include = "src/**/*.py" },
]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
typer = "^0.15.1"
requests = "^2.32.3"
schedule = "^1.2.2"
logging = "^0.4.9.6"
mysql-connector-python = "^9.1.0"
urllib3 = "^2.3.0"
flask = "^3.1.0"
flask-cors = "^5.0.0"
beautifulsoup4 = "4.11.1"
flask-limiter = "^3.9.2"
python-dotenv = "^1.0.1"
flask-restful = "^0.3.10"
levenshtein = "^0.26.1"
cloudscraper = "^1.2.71"
cfscrape = "^2.1.1"
psutil = "^7.0.0"
scrapfly-sdk = "^0.8.21"
scrapingbee = "^2.0.1"
apscheduler = "^3.11.0"
playwright = "^1.55.0"

[tool.poetry.scripts]
arrematai = "src.__main__:server_init"
seed = "seeds.__seed__:init"
test = "tests.__test__:init"
teste2 = "tests.teste2:init"
test_le = "tests.test_leiloeiros:init"
checkOnline = "src.checkSiteOnline:init"
monitoramento = "src.monitoramento:init"
schedulers = "src.schedulers:init"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
